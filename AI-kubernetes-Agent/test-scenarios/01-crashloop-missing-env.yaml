apiVersion: v1
kind: Namespace
metadata:
  name: agent-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashloop-missing-env
  namespace: agent-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashloop-missing-env
  template:
    metadata:
      labels:
        app: crashloop-missing-env
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$REQUIRED_DATABASE_URL" ]; then
                echo "FATAL: missing environment variable REQUIRED_DATABASE_URL"
                exit 1
              fi
              sleep 3600
