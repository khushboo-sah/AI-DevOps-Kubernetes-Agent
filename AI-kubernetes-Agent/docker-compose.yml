services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      INSFORGE_API_BASE_URL: https://wznstw3m.eu-central.insforge.app
      KUBECONFIG: /root/.kube/config
      # kind/minikube use 127.0.0.1 — rewrite for Docker (see backend/scripts/docker-entrypoint.sh)
      KUBE_API_REWRITE_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${HOME}/.kube:/root/.kube:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_INSFORGE_BASE_URL: https://wznstw3m.eu-central.insforge.app
        NEXT_PUBLIC_INSFORGE_ANON_KEY: anon_c2b40b3499dce755117cd876b8f3e418df36fb323173b5358435d10f732c35fa
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_INSFORGE_BASE_URL: https://wznstw3m.eu-central.insforge.app
      NEXT_PUBLIC_INSFORGE_ANON_KEY: anon_c2b40b3499dce755117cd876b8f3e418df36fb323173b5358435d10f732c35fa
    ports:
      - "3000:3000"
    depends_on:
      - backend
